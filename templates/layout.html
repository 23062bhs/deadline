<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title> <!-- page title set by each template -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}"> <!-- favicon icon in browser tab -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- link to css file -->
    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet"> <!-- import satoshi font -->
    <script src="https://kit.fontawesome.com/ada09c2be0.js" crossorigin="anonymous"></script> <!-- import icons -->
</head>
<body>
    <!-- banner at the top of every page -->
    <header>
        <div class="header-content">
            <!-- favicon -->
            <img src="{{ url_for('static', filename='images/favicon.png') }}" class="header-logo" alt="Logo">
            <!-- application title which also sends the user to the home page -->
            <a href="/">Deadline</a>
            <!-- the user's profile icon that inclues the first 2 letters of their name -->
            <a href="/profile" class="profile-icon">{{ session['username'][0].upper() }}{{ session['username'][1].upper() if session['username']|length > 1 else '' }}</a>
        </div>
    </header>
    <!-- navigation bar -->
    <div class="main-container">
        <nav class="navbar">
            <ul>
                <!-- link to each page along with the add task and subject modals and the log out button -->
                <li><a href="/"><i class="fa-solid fa-house"></i>Home</a></li>
                <li><a href="/subjects"><i class="fa-solid fa-book"></i>Subjects</a></li>
                <li><a href="javascript:void(0)" id="open-subject-modal-btn"><i class="fa-solid fa-plus"></i>Add Subject</a></li>
                <hr class="nav-divider"> <!-- divides the navigation bar into 2 sections -->
                <li><a href="/tasks"><i class="fa-solid fa-list-check"></i>Tasks</a></li>
                <li><a href="javascript:void(0)" id="open-task-modal-btn"><i class="fa-solid fa-calendar-plus"></i>Add Task</a></li>
                <li><a href="/logout"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a></li>
            </ul>
        </nav>

        <!-- main content -->
        <main>
            <div style="padding-bottom: 2rem;">
                {% block content %}{% endblock %}
            </div>
            <footer>&copy; Deadline 2026</footer> <!-- footer -->
        </main>

    </div> 
    {% include 'modals.html' %} <!-- allows the add subject and task button in the navigation bar to work on other pages -->
    <script src="{{ url_for('static', filename='script.js') }}"></script> <!-- link to javascript file -->
</body>
</html>
