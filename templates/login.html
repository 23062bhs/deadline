<!DOCTYPE html> <!-- only one page for account login, doesn't need to extend layout.html -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Deadline</title> <!-- page title set by each template -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}"> <!-- favicon icon in browser tab -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- link to css file -->
    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet"> <!-- import satoshi font -->
    <script src="https://kit.fontawesome.com/ada09c2be0.js" crossorigin="anonymous"></script> <!-- import icons -->
</head>
<body class="auth-body">
    <!-- header content -->
    <header>
        <div class="header-content">
            <!-- favicon -->
            <img src="{{ url_for('static', filename='images/favicon.png') }}" class="header-logo" alt="Logo">
            <!-- application title -->
            <p>Deadline</p>
        </div>
    </header>
    <!-- login page -->
    <div class="auth-container">
        <!-- login page title -->
        <h1>Log In</h1>
        <!-- allows the error message to disappear after reloading -->
        {% with messages = get_flashed_messages() %} 
            {% if messages %}
                {% for message in messages %}
                    <p class="auth-error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <!-- login form -->
        <form method="POST" action="/login">
            <!-- username input -->
            <div class="auth-input-group">
                <label>Username</label>
                <!-- username stays if the log in fails -->
                <input type="text" name="username" value="{{ session.pop('form_username', '') }}" required>
            </div>
            <!-- password input -->
            <div class="auth-input-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <!-- log in button -->
            <button type="submit" class="save-btn">Log In</button>
        </form>
        <!-- sends the user to the sign up page if they don't have an account -->
        <p>Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
</body>
<footer class="auth-footer">&copy; Deadline 2026</footer> <!-- footer -->
