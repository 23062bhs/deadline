{% extends "layout.html" %}

{% block title %}Edit Profile | Deadline{% endblock %}

{% block content %}

<!-- header -->
<div class="header-section">
    <div class="intro">
        <h1>Edit Profile</h1>
        <p>Update your account details</p>
    </div>
</div>

<!-- edit profile page -->
<div class="edit-user-information">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="auth-error">{{ messages[0] }}</div>
        {% endif %}
    {% endwith %}
    <form method="POST" action="/edit-profile">
        <div class="edit-input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ session['username'] }}" required>
        </div>
        <div class="edit-input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>
        <div class="edit-input-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password">
        </div>
        <button type="submit" class="edit-save-btn">Save changes</button>
    </form>
    <a href="/profile" class="profile-logout-btn">Cancel</a>
</div>

{% endblock %}
